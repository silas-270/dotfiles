# ==============================================================================
# HYPRLOCK CONFIGURATION (Desktop TUI Architecture)
# ==============================================================================
# Matches the design system of Rustbar, Control Center, and Rofi:
# - Typography: JetBrainsMono Nerd Font (Medium for headers/clock, Regular for modules)
# - Sizing: Calibrated to Rustbar's 32px module boxes & Control Center fieldsets
# - Sharp rectangular 0-radius boxes with 1-2px borders
# - Dynamic theming sourced directly from theme/generated/colors-hyprlock.conf
# - 3-pass blurred backdrop matching Hyprland desktop rules
# - Symmetrical geometry: 420px content span perfectly aligned across all rows
# ==============================================================================

source = ~/.config/theme/generated/colors-hyprlock.conf

# ── Backdrop Wallpaper with 3-Pass Frosted Blur ──
background {
    monitor =
    path = /home/silas270/.cache/wallpaper-home.jpg
    color = $bg_base
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# ── Central Card Container (W: 500, H: 380) ──
shape {
    monitor =
    size = 500, 380
    color = $bg_base_alpha
    rounding = 0
    border_size = 2
    border_color = $border
    position = 0, 0
    halign = center
    valign = center
}

# ── Section Header (Control Center Style: Medium Weight + Divider Rule) ──
label {
    monitor =
    text = SESSION LOCK
    color = $accent
    font_size = 12
    font_family = JetBrainsMono Nerd Font Medium
    position = -153, 155
    halign = center
    valign = center
}

shape {
    monitor =
    size = 295, 2
    color = $border
    rounding = 0
    border_size = 0
    position = 62, 155
    halign = center
    valign = center
}

# ── Clock (Control Center Medium Weight, 64pt) ──
label {
    monitor =
    text = $TIME
    color = $fg_primary
    font_size = 64
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 78
    halign = center
    valign = center
}

# ── Date (Day, DD. Month YYYY) ──
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B %Y"
    color = $fg_muted
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = center
}

# ── Sub-divider line ──
shape {
    monitor =
    size = 420, 1
    color = $border_subtle
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# ── Password Input Box (Native, Sharp, Framed) ──
input-field {
    monitor =
    size = 420, 46
    outline_thickness = 2
    outer_color = $border
    inner_color = $bg_input
    font_color = $fg_primary
    check_color = $accent
    fail_color = $danger
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span font_family="JetBrainsMono Nerd Font" foreground="##$fg_muted_hex">[ enter password ]</span>
    fail_text = <span font_family="JetBrainsMono Nerd Font" foreground="##$danger_hex">[ authentication failed ($ATTEMPTS) ]</span>
    capslock_color = $warning
    font_family = JetBrainsMono Nerd Font
    position = 0, -50
    halign = center
    valign = center
}

# ── Footer Module Box: User (Rustbar 32px GTK Box, Regular Weight) ──
shape {
    monitor =
    size = 202, 32
    color = $bg_input
    rounding = 0
    border_size = 1
    border_color = $border
    position = -109, -135
    halign = center
    valign = center
}

label {
    monitor =
    text = [   $USER ]
    color = $fg_muted
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -109, -135
    halign = center
    valign = center
}

# ── Footer Module Box: Keyboard Layout (Rustbar 32px GTK Box, Regular Weight) ──
shape {
    monitor =
    size = 202, 32
    color = $bg_input
    rounding = 0
    border_size = 1
    border_color = $border
    position = 109, -135
    halign = center
    valign = center
}

label {
    monitor =
    text = [   $LAYOUT ]
    color = $fg_muted
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 109, -135
    halign = center
    valign = center
}
