# Savanna Dusk Hyprlock Configuration (Exact 1:1 SDDM 'africa' Match)

background {
    monitor =
    path = /home/silas270/dotfiles/wallpapers/wallpaper-home.jpg
    color = rgba(30, 19, 13, 0.35)
    blur_passes = 0
}

# ── Panel 1: Clock Background Shape ──
shape {
    monitor =
    size = 480, 140
    color = rgb(84, 56, 43)
    rounding = 0
    border_size = 0
    position = 0, 79
    halign = center
    valign = center
}

# ── Panel 1: Clock Time Text (24h HH:MM) ──
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgb(194, 170, 149)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 79
    halign = center
    valign = center
}

# ── Panel 2: Password Panel Shape ──
shape {
    monitor =
    size = 480, 62
    color = rgb(84, 56, 43)
    rounding = 0
    border_size = 0
    position = 0, -46
    halign = center
    valign = center
}

# ── Panel 2: Left Bracket [ ──
label {
    monitor =
    text = [
    color = rgb(217, 119, 54)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -213, -46
    halign = center
    valign = center
}

# ── Panel 2: Password Input Field (Left-Aligned, 18pt Asterisks) ──
input-field {
    monitor =
    size = 340, 42
    outline_thickness = 0
    dots_size = 0.57
    dots_spacing = 0.15
    dots_center = false
    dots_text_format = *
    outer_color = rgb(84, 56, 43)
    inner_color = rgb(84, 56, 43)
    font_color = rgb(194, 170, 149)
    fade_on_empty = false
    placeholder_text = <span font_family="JetBrainsMono Nerd Font" size="18432" color="##C2AA95">silas                  </span>
    hide_input = false
    rounding = 0
    check_color = rgb(217, 119, 54)
    fail_color = rgb(192, 57, 43)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = -26, -46
    halign = center
    valign = center
}

