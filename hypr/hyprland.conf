# monitor
monitor = ,preferred,auto,1

# autostart
exec-once = killall swaybg; swaybg -i /home/silas270/Bilder/Wallpaper/wallpaper-home.jpg -m fill
exec-once = waybar
# exec-once = nm-applet --indicator
exec-once = ~/.config/hypr/scripts/control-center/target/release/control-center
# exec-once = dunst  # Deaktiviert: Benachrichtigungen dauerhaft aus

# input
input {
    kb_layout    = de
    follow_mouse = 1
}

# general
general {
    gaps_in  = 5
    gaps_out = 10
    border_size = 1
    col.active_border   = 0xffffffaa
    col.inactive_border = 0x00000000
    layout = dwindle
}

# decoration
decoration {
    rounding = 16
    blur {
        enabled = true
        size    = 8
        passes  = 3
    }
    shadow {
        enabled = false
    }
}

# waybar / rofi
layerrule = blur on, ignore_alpha 1, match:namespace waybar
layerrule = blur on, ignore_alpha 0.5, match:namespace rofi

# control-center (Layer-Shell-Panel, Namespace wird im Rust-Code via
# window.set_namespace("control-center") gesetzt)
layerrule = blur on, ignore_alpha 0.1, match:namespace control-center

# Fenster-Regel: floating, keine Titelleiste, kein Fokus-Diebstahl beim Öffnen
windowrule = float on, match:class ^(control-center)$

# Keybind zum Toggeln - startet den Prozess wenn er nicht läuft,
# killt ihn wenn er läuft (dadurch: 0 MB RAM wenn zu)
bind = SUPER, C, exec, ~/.config/hypr/scripts/control-center/target/release/control-center
bind = SUPER ALT, K, exec, ~/.config/hypr/scripts/toggle-keyd.sh


# animations
animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.05
    animation = windows,    1, 2, snappy, slide
    animation = windowsOut, 1, 2, snappy, slide
    animation = fade,       1, 2, snappy
    animation = workspaces, 1, 2, snappy, slide
}

# misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    disable_hyprland_guiutils_check = true
}

# keybinds
$mainMod = SUPER

bind = $mainMod,       Return, exec,      kitty
bind = $mainMod,       Q,      killactive
bind = $mainMod,       Space,  exec,      rofi -show drun
bind = $mainMod,       M,      exec, ~/.config/hypr/scripts/power-menu.sh
bind = $mainMod,       F,      fullscreen
bind = $mainMod,       V,      togglefloating

bind = $mainMod,       H, movefocus, l
bind = $mainMod,       L, movefocus, r
bind = $mainMod,       K, movefocus, u
bind = $mainMod,       J, movefocus, d

bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Navigate to the next/previous workspace
bind = SUPER, right, workspace, e+1
bind = SUPER, left, workspace, e-1

# Move the focused window to the next/previous workspace
bind = SUPER SHIFT, right, movetoworkspace, e+1
bind = SUPER SHIFT, left, movetoworkspace, e-1

# Switch to workspace 1-5
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Move window to workspace 1-5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

# screenshots
bind =               , Print, exec, hyprshot -m region
bind = $mainMod,       Print, exec, hyprshot -m window
bind = $mainMod SHIFT, Print, exec, hyprshot -m output

# media / fn keys (F1: mute, F2: leiser, F3: lauter, F4: prev, F5: play/pause, F6: next, F11: brightness-, F12: brightness+)
bindl  = , XF86AudioMute,         exec, ~/.config/hypr/scripts/change-volume.sh toggle
bindel = , XF86AudioLowerVolume,  exec, ~/.config/hypr/scripts/change-volume.sh lower
bindel = , XF86AudioRaiseVolume,  exec, ~/.config/hypr/scripts/change-volume.sh raise
bindl  = , XF86AudioPrev,         exec, playerctl previous
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/change-brightness.sh -5%
bindel = , XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/change-brightness.sh +5%

# Disable Xwayland for pure Wayland RAM savings (-82 MB)
xwayland {
    enabled = false
}

