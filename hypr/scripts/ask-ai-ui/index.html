<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask AI</title>
  <link rel="stylesheet" href="vendor/katex.min.css">
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/auto-render.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <style>
    :root {
      --bg-terminal: rgba(28, 28, 32, 0.55);
      --fg-primary: #F2E3D5;
      --fg-muted: #A89E94;
      --accent: #FF8C00;
      --border: rgba(255, 255, 255, 0.12);
      --code-bg: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
    }

    html {
      background: transparent !important;
    }

    body {
      position: relative;
      background: var(--bg-terminal, rgba(28, 28, 32, 0.55));
      color: var(--fg-primary);
      font-family: 'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace;
      font-size: 16px;
      line-height: 1.5;
      border: 1px solid var(--border);
      border-radius: 0;
    }

    #terminal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: text;
      box-sizing: border-box;
    }

    #terminal::-webkit-scrollbar {
      width: 6px;
    }
    #terminal::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 0;
    }

    .turn-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* CLI Prompt line */
    .user-line {
      color: var(--accent);
      font-weight: bold;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* AI Response - Distinguishable from prompt, never inherits accent */
    .ai-response {
      color: var(--fg-primary);
      word-break: break-word;
    }

    .ai-response p {
      margin-bottom: 12px;
    }
    .ai-response p:last-child {
      margin-bottom: 0;
    }

    .ai-response strong {
      color: #FFFFFF;
      font-weight: 700;
    }

    .ai-response em {
      color: var(--fg-muted);
    }

    .ai-response a {
      color: #70b8ff;
      text-decoration: none;
    }

    .ai-response ul, .ai-response ol {
      margin-left: 20px;
      margin-bottom: 12px;
    }

    .ai-response li {
      margin-bottom: 4px;
    }

    .ai-response code {
      background: var(--code-bg);
      color: #FFFFFF;
      padding: 2px 6px;
      border-radius: 0;
      font-size: 0.95em;
    }

    .ai-response pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 10px 14px;
      margin: 12px 0;
      overflow-x: auto;
    }
    .ai-response pre code {
      background: transparent;
      padding: 0;
    }

    /* Math typography */
    .katex {
      font-size: 1.08em;
      color: var(--fg-primary);
    }
    .katex-display {
      margin: 14px 0;
      text-align: center;
    }

    /* CLI animated status indicator - clean, no box/rect */
    .status-line {
      color: var(--fg-muted);
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .spinner-glyph {
      color: var(--fg-muted);
      font-style: normal;
      font-weight: bold;
      display: inline-block;
      width: 1ch;
      text-align: center;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .error-line {
      color: #E74C3C;
      font-weight: bold;
      word-break: break-word;
      white-space: pre-wrap;
      padding: 4px 0;
    }

    /* Active input row styled seamlessly as a CLI prompt */
    .input-row {
      display: flex;
      align-items: flex-start;
      color: var(--accent);
      font-weight: bold;
      min-height: 24px;
    }

    .prompt-symbol {
      user-select: none;
      margin-right: 6px;
    }

    #prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      font-weight: bold;
      color: var(--accent);
      caret-color: var(--accent);
      resize: none;
      overflow: hidden;
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="terminal">
    <div id="history"></div>
    <div class="input-row" id="input-row">
      <span class="prompt-symbol">&gt;</span>
      <textarea id="prompt-input" rows="1" autofocus spellcheck="false" autocomplete="off"></textarea>
    </div>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const historyContainer = document.getElementById('history');
    const inputRow = document.getElementById('input-row');
    const promptInput = document.getElementById('prompt-input');

    // Clean ASCII slash frames for CLI spinner - no missing unicode font boxes
    const SPINNER_FRAMES = ['/', '-', '\\', '|'];
    let spinnerTimer = null;
    let spinnerFrameIdx = 0;

    let currentTurnBlock = null;
    let currentStatusDiv = null;
    let currentResponseDiv = null;
    let currentRawText = '';
    let isThinking = false;

    // Error capture forwarded to Python logger
    window.onerror = function(msg, url, line, col, err) {
      const errMsg = `${msg} (${line}:${col})`;
      if (window.webkit?.messageHandlers?.pybridge) {
        window.webkit.messageHandlers.pybridge.postMessage(JSON.stringify({
          action: 'error',
          message: errMsg
        }));
      }
    };

    function startSpinner(statusEl) {
      stopSpinner();
      spinnerFrameIdx = 0;
      spinnerTimer = setInterval(() => {
        spinnerFrameIdx = (spinnerFrameIdx + 1) % SPINNER_FRAMES.length;
        const glyph = statusEl.querySelector('.spinner-glyph');
        if (glyph) {
          glyph.textContent = SPINNER_FRAMES[spinnerFrameIdx];
        }
      }, 90);
    }

    function stopSpinner() {
      if (spinnerTimer) {
        clearInterval(spinnerTimer);
        spinnerTimer = null;
      }
    }

    function hexToRgba(hex, alpha) {
      if (hex && hex.startsWith('#') && hex.length >= 7) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }
      return hex;
    }

    // Theme injection from Python
    function setTheme(colors) {
      if (!colors) return;
      const root = document.documentElement;
      if (colors.fg_primary) root.style.setProperty('--fg-primary', colors.fg_primary);
      if (colors.fg_muted) root.style.setProperty('--fg-muted', colors.fg_muted);
      if (colors.accent) root.style.setProperty('--accent', colors.accent);
      if (colors.border) root.style.setProperty('--border', hexToRgba(colors.border, 0.25));
    }

    function normalizeUnicodeMath(text) {
      if (!text) return text;
      // Convert combining macron x̄ -> \bar{x}
      let s = text.replace(/([a-zA-Z0-9])\u0304/g, '$\\bar{$1}$');

      // Superscripts
      s = s.replace(/⁻¹/g, '$^{-1}$');
      s = s.replace(/([a-zA-Z0-9\\]+)([ⁿᵐᵏ⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, (_, base, exp) => {
        const supMap = {'ⁿ':'n','ᵐ':'m','ᵏ':'k','⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
        const cleanExp = exp.split('').map(c => supMap[c] || c).join('');
        return `$${base}^{${cleanExp}}$`;
      });

      // Blackboard bold & Fraktur
      s = s.replace(/ℝ/g, '$\\mathbb{R}$');
      s = s.replace(/ℂ/g, '$\\mathbb{C}$');
      s = s.replace(/ℕ/g, '$\\mathbb{N}$');
      s = s.replace(/ℤ/g, '$\\mathbb{Z}$');
      s = s.replace(/ℚ/g, '$\\mathbb{Q}$');
      s = s.replace(/𝔐/g, '$\\mathfrak{M}$');
      s = s.replace(/𝔑/g, '$\\mathfrak{N}$');

      // Common relations and operators
      s = s.replace(/∈/g, '$\\in$');
      s = s.replace(/∉/g, '$\\notin$');
      s = s.replace(/⊂/g, '$\\subset$');
      s = s.replace(/⊆/g, '$\\subseteq$');

      return s;
    }

    function renderMarkdownAndMath(text) {
      try {
        text = normalizeUnicodeMath(text);
        const math = [];
        // Protect display math
        let s = text.replace(/(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\])/g, m => {
          math.push(m);
          return `@@MATH_${math.length - 1}@@`;
        });
        // Protect inline math
        s = s.replace(/(\$[^$\n]+?\$|\\\([\s\S]*?\\\))/g, m => {
          math.push(m);
          return `@@MATH_${math.length - 1}@@`;
        });

        let html = marked.parse(s, { breaks: true, gfm: true });
        html = html.replace(/@@MATH_(\d+)@@/g, (_, idx) => math[parseInt(idx, 10)]);
        return html;
      } catch (err) {
        console.error('Markdown parse error:', err);
        return text;
      }
    }

    function scrollToBottom() {
      terminal.scrollTop = terminal.scrollHeight;
    }

    // Add user question to terminal
    function addUserMessage(text) {
      currentTurnBlock = document.createElement('div');
      currentTurnBlock.className = 'turn-block';

      const line = document.createElement('div');
      line.className = 'user-line';
      line.textContent = `> ${text}`;
      currentTurnBlock.appendChild(line);

      historyContainer.appendChild(currentTurnBlock);
      scrollToBottom();
    }

    // Prepare response with animated CLI spinner
    function startAiResponse() {
      isThinking = true;
      currentRawText = '';

      if (!currentTurnBlock) {
        currentTurnBlock = document.createElement('div');
        currentTurnBlock.className = 'turn-block';
        historyContainer.appendChild(currentTurnBlock);
      }

      const status = document.createElement('div');
      status.className = 'status-line';
      status.innerHTML = '<span class="spinner-glyph">⠋</span> thinking...';
      currentTurnBlock.appendChild(status);

      const resp = document.createElement('div');
      resp.className = 'ai-response';
      resp.style.display = 'none';
      currentTurnBlock.appendChild(resp);

      currentStatusDiv = status;
      currentResponseDiv = resp;

      startSpinner(status);
      scrollToBottom();
    }

    // Append streaming chunk
    function appendAiChunk(chunk) {
      if (!currentResponseDiv) startAiResponse();
      stopSpinner();

      if (currentStatusDiv) {
        currentStatusDiv.style.display = 'none';
      }
      if (currentResponseDiv) {
        currentResponseDiv.style.display = 'block';
      }

      isThinking = false;
      currentRawText += chunk;

      try {
        currentResponseDiv.innerHTML = renderMarkdownAndMath(currentRawText);
        if (window.renderMathInElement) {
          renderMathInElement(currentResponseDiv, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '\\[', right: '\\]', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
          });
        }
      } catch (e) {
        currentResponseDiv.textContent = currentRawText;
      }

      scrollToBottom();
    }

    // Turn complete
    function finishAiResponse() {
      stopSpinner();
      if (currentStatusDiv && isThinking) {
        currentStatusDiv.textContent = 'No response.';
      }
      isThinking = false;
      currentStatusDiv = null;
      currentResponseDiv = null;
      currentTurnBlock = null;

      inputRow.style.display = 'flex';
      promptInput.disabled = false;
      promptInput.focus();
      scrollToBottom();
    }

    // Display error line in terminal
    function showAiError(errMsg) {
      stopSpinner();
      if (currentStatusDiv) {
        currentStatusDiv.remove();
        currentStatusDiv = null;
      }

      const err = document.createElement('div');
      err.className = 'error-line';
      err.textContent = `[error] ${errMsg}`;

      if (currentTurnBlock) {
        currentTurnBlock.appendChild(err);
      } else {
        historyContainer.appendChild(err);
      }

      finishAiResponse();
    }

    function submitPrompt() {
      const text = promptInput.value.trim();
      if (!text || isThinking) return;

      addUserMessage(text);
      promptInput.value = '';
      promptInput.style.height = 'auto';
      promptInput.disabled = true;
      inputRow.style.display = 'none';

      startAiResponse();

      if (window.webkit?.messageHandlers?.pybridge) {
        window.webkit.messageHandlers.pybridge.postMessage(JSON.stringify({
          action: 'ask',
          prompt: text
        }));
      }
    }

    // Keyboard handling: Enter submits, Shift+Enter newlines
    promptInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitPrompt();
      }
    });

    // Auto-grow textarea height
    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = promptInput.scrollHeight + 'px';
      scrollToBottom();
    });

    // Focus input when clicking anywhere in terminal
    terminal.addEventListener('click', (e) => {
      // Don't steal focus if user is selecting text
      if (window.getSelection().toString().length === 0) {
        promptInput.focus();
      }
    });

    // Keyboard scrolling (PageUp, PageDown, Shift+PageUp, Shift+PageDown, Ctrl+u, Ctrl+d)
    window.addEventListener('keydown', e => {
      if (e.key === 'PageUp' || (e.ctrlKey && e.key === 'u')) {
        e.preventDefault();
        terminal.scrollBy({ top: -terminal.clientHeight * 0.75, behavior: 'smooth' });
      } else if (e.key === 'PageDown' || (e.ctrlKey && e.key === 'd')) {
        e.preventDefault();
        terminal.scrollBy({ top: terminal.clientHeight * 0.75, behavior: 'smooth' });
      }
    });

    // Universal wheel scrolling
    window.addEventListener('wheel', e => {
      terminal.scrollTop += e.deltaY;
    }, { passive: true });

    window.addEventListener('DOMContentLoaded', () => {
      promptInput.focus();
      if (window.webkit?.messageHandlers?.pybridge) {
        window.webkit.messageHandlers.pybridge.postMessage(JSON.stringify({ action: 'ready' }));
      }
    });
  </script>
</body>
</html>
